- name: Render Headscale configuration
  ansible.builtin.template:
    src: headscale.yaml.j2
    dest: '{{ node_dir }}/config.yaml'
    mode: '0600'
  register: headscale_config
- name: Render restrictive mesh policy
  ansible.builtin.template:
    src: policy.json.j2
    dest: '{{ node_dir }}/policy.json'
    mode: '0600'
  register: headscale_policy
- name: Install Headscale TLS credentials
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ node_dir }}/{{ item.dest }}'
    mode: '0600'
  loop:
  - src: '{{ headscale_tls_cert }}'
    dest: cert.pem
  - src: '{{ headscale_tls_key }}'
    dest: key.pem
  no_log: true
  register: headscale_certs
  when: not headscale_external_tls | bool
- name: Start the selected coordination container runtime
  ansible.builtin.include_tasks: container-{{ container_engine }}.yml
- name: Wait for Headscale database and control socket
  ansible.builtin.command:
    argv:
    - '{{ container_engine }}'
    - exec
    - '{{ container_name }}'
    - headscale
    - nodes
    - list
    - -o
    - json
  register: headscale_nodes
  changed_when: false
  until: headscale_nodes.rc == 0
  retries: 45
  delay: 2
  environment: '{{ container_cli_environment }}'
- name: Provision independent node enrollment credentials
  ansible.builtin.include_tasks: enrollment.yml
  loop: '{{ groups.control + groups.exits + groups.ingress }}'
  loop_control:
    loop_var: mesh_node
