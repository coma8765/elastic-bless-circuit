- name: Select exit role when not supplied by caller
  ansible.builtin.set_fact:
    node_role: '{{ node_role | default(''out'') }}'
- name: Validate optional Docker node resource limits
  ansible.builtin.assert:
    that:
    - node_memory is not defined or (node_memory is string and node_memory is match('^[1-9][0-9]*[mMgG]$'))
    - node_memory_swap is not defined or (node_memory is defined and node_memory_swap is string and node_memory_swap is match('^[1-9][0-9]*[mMgG]$'))
    - node_pids_limit is not defined or (node_pids_limit is integer and node_pids_limit >= 1 and node_pids_limit <= 65535)
    fail_msg: Docker node limits require positive m/g memory strings, swap requires memory, and pids must be an integer in 1..65535.
  when: container_engine == 'docker'
- name: Validate Docker node memory and combined memory-swap bounds
  ansible.builtin.assert:
    that:
    - (node_memory | human_to_bytes) >= 6291456
    - node_memory_swap is not defined or (node_memory_swap | default(node_memory) | human_to_bytes) >= (node_memory | human_to_bytes)
    fail_msg: Node memory must be at least 6 MiB; combined memory-swap must not be smaller than memory.
  when: container_engine == 'docker' and node_memory is defined
- name: Verify gateway capabilities before changing the running configuration
  ansible.builtin.command:
    argv:
      - '{{ container_engine }}'
      - image
      - inspect
      - --format
      - '{{ ''{{ index .Config.Labels "io.vless.geoip-gateway" }}'' }}'
      - '{{ node_image }}'
  environment: '{{ container_cli_environment }}'
  register: gateway_capability
  changed_when: false
  failed_when: gateway_capability.rc != 0 or gateway_capability.stdout | trim != '1'
  when: node_role == 'gateway' or (node_role == 'in' and ingress_route_gateway | default('') | length > 0)
- name: Install only this node's mesh enrollment key
  ansible.builtin.copy:
    src: '{{ controller_state_dir }}/enrollment/{{ inventory_hostname }}.key'
    dest: '{{ node_dir }}/secrets/headscale-key'
    mode: '0600'
  register: mesh_secret
  no_log: true
- name: Install private Headscale CA when configured
  ansible.builtin.copy:
    src: '{{ headscale_ca_file }}'
    dest: '{{ node_dir }}/secrets/headscale-ca.pem'
    mode: '0600'
  register: mesh_ca
  when: headscale_ca_file | length > 0
- name: Install panel credentials for control and ingress only
  ansible.builtin.copy:
    content: '{{ item.content }}'
    dest: '{{ node_dir }}/secrets/{{ item.name }}'
    mode: '0600'
  loop:
  - name: panel-user
    content: '{{ panel_username }}'
  - name: panel-password
    content: '{{ hostvars[groups.headscale[0]].panel_password }}'
  when: node_role in ['in', 'control']
  register: panel_secrets
  no_log: true
- name: Install the exit's transit identity
  ansible.builtin.copy:
    src: '{{ controller_state_dir }}/transit/{{ inventory_hostname }}.uuid'
    dest: '{{ node_dir }}/secrets/transit-uuid'
    mode: '0600'
  when: node_role == 'out'
  register: transit_secret
  no_log: true
- name: Install authorized exit credentials on ingress and route gateways
  ansible.builtin.copy:
    src: '{{ controller_state_dir }}/transit/{{ item }}.uuid'
    dest: "{{ node_dir }}/secrets/{{ 'exit-' + item + '.uuid' if node_role == 'gateway' else item + '-uuid' }}"
    mode: '0600'
  loop: "{{ route_exits if node_role == 'gateway' else groups.exits }}"
  when: node_role in ['in', 'gateway']
  register: ingress_transit
  no_log: true
- name: Install this ingress's gateway transit credential
  ansible.builtin.copy:
    src: '{{ controller_state_dir }}/route-gateways/{{ ingress_route_gateway }}/{{ inventory_hostname }}.uuid'
    dest: '{{ node_dir }}/secrets/gateway-transit.uuid'
    mode: '0600'
  when: node_role == 'in' and ingress_route_gateway | default('') | length > 0
  register: gateway_transit
  no_log: true
- name: Install the gateway's authorized ingress identities
  ansible.builtin.copy:
    src: '{{ controller_state_dir }}/route-gateways/{{ inventory_hostname }}/{{ item }}.uuid'
    dest: '{{ node_dir }}/secrets/gateway-{{ item }}.uuid'
    mode: '0600'
  loop: '{{ route_readers | default([]) }}'
  when: node_role == 'gateway'
  register: gateway_readers
  no_log: true
- name: Remove this ingress's Auto credential after detachment
  ansible.builtin.file:
    path: '{{ node_dir }}/secrets/gateway-transit.uuid'
    state: absent
  when: node_role == 'in' and not ingress_route_gateway | default('')
- name: Remove retired gateway credentials
  when: node_role == 'gateway'
  block:
    - name: List the managed gateway secret files
      ansible.builtin.find:
        paths: '{{ node_dir }}/secrets'
        patterns: ['gateway-*.uuid', 'exit-*.uuid']
        file_type: file
      register: stored_gateway_secrets
    - name: Discard credentials outside the configured gateway topology
      ansible.builtin.file:
        path: '{{ item.path }}'
        state: absent
      vars:
        reader_keys: "{{ route_readers | map('regex_replace', '^(.*)$', 'gateway-\\1.uuid') | list }}"
        exit_keys: "{{ route_exits | map('regex_replace', '^(.*)$', 'exit-\\1.uuid') | list }}"
      loop: '{{ stored_gateway_secrets.files }}'
      loop_control:
        label: '{{ item.path | basename }}'
      when: item.path | basename not in (reader_keys + exit_keys)
- name: Install ingress TLS credentials
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ node_dir }}/secrets/{{ item.dest }}'
    mode: '0600'
  loop:
  - src: '{{ ingress_tls_cert }}'
    dest: fullchain.pem
  - src: '{{ ingress_tls_key }}'
    dest: privkey.pem
  when: node_role == 'in' and ingress_security == 'tls'
  register: ingress_certs
  no_log: true
- name: Install the persistent ingress REALITY private key
  ansible.builtin.copy:
    content: '{{ (lookup(''ansible.builtin.file'', controller_state_dir + ''/reality/'' + inventory_hostname + ''.json'')
      | from_json).private_key }}'
    dest: '{{ node_dir }}/secrets/reality-private-key'
    mode: '0600'
  when: node_role == 'in' and ingress_security == 'reality'
  register: ingress_reality
  no_log: true
- name: Render node YAML
  ansible.builtin.template:
    src: node.yaml.j2
    dest: '{{ node_dir }}/config.yaml'
    mode: '0600'
  register: node_config
- name: Start the selected mesh container runtime
  ansible.builtin.include_tasks: container-{{ container_engine }}.yml
- name: Wait for node supervision and initial configuration
  ansible.builtin.command:
    argv:
    - '{{ container_engine }}'
    - exec
    - '{{ container_name }}'
    - test
    - -f
    - /run/node/ready
  register: node_ready
  changed_when: false
  until: node_ready.rc == 0
  retries: 60
  delay: 2
  environment: '{{ container_cli_environment }}'
- name: Discover the persistent mesh address
  ansible.builtin.command:
    argv:
    - '{{ container_engine }}'
    - exec
    - '{{ container_name }}'
    - tailscale
    - ip
    - -4
  register: mesh_address
  changed_when: false
  environment: '{{ container_cli_environment }}'
- name: Retain the discovered mesh address for later plays
  ansible.builtin.set_fact:
    mesh_ip: '{{ mesh_address.stdout | trim }}'
