# Deploy on each host: podman compose -f infra/compose.yaml --profile in up -d
services:
  in:
    profiles: [in]
    image: localhost/vless-node:dev
    build:
      context: ..
      dockerfile: infra/Dockerfile.common
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    devices: [/dev/net/tun:/dev/net/tun]
    security_opt: [label=disable, no-new-privileges:true]
    ports: ["443:443/tcp", "41641:41641/udp"]
    volumes:
      - ../config/in.yaml:/etc/node/config.yaml:ro
      - ../secrets/in:/run/secrets:ro
      - in-state:/var/lib/tailscale
      - in-cache:/var/lib/node
    read_only: true
    tmpfs: [/run, /tmp]
    stop_grace_period: 20s
  out:
    profiles: [out]
    image: localhost/vless-node:dev
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    devices: [/dev/net/tun:/dev/net/tun]
    security_opt: [label=disable, no-new-privileges:true]
    ports: ["41641:41641/udp"]
    volumes:
      - ../config/out.yaml:/etc/node/config.yaml:ro
      - ../secrets/out:/run/secrets:ro
      - out-state:/var/lib/tailscale
    read_only: true
    tmpfs: [/run, /tmp]
    stop_grace_period: 20s
  control:
    profiles: [control]
    image: localhost/vless-control:dev
    build:
      context: ..
      dockerfile: infra/Dockerfile.control
    restart: unless-stopped
    ports: ["127.0.0.1:2053:2053", "127.0.0.1:2096:2096"]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    devices: [/dev/net/tun:/dev/net/tun]
    security_opt: [label=disable, no-new-privileges:true]
    volumes:
      - control-db:/etc/x-ui
      - control-state:/var/lib/tailscale
      - ../config/control.yaml:/etc/node/config.yaml:ro
      - ../secrets/control:/run/secrets:ro
    cap_drop: [ALL]
volumes:
  in-state:
  in-cache:
  out-state:
  control-db:
  control-state:
