- name: Start the supervised mesh service
  containers.podman.podman_container:
    name: '{{ container_name }}'
    image: '{{ control_image if node_role == ''control'' else node_image }}'
    state: started
    restart_policy: always
    recreate: '{{ node_config.changed or mesh_secret.changed or mesh_ca.changed or panel_secrets.changed or transit_secret.changed
      or ingress_transit.changed or ingress_certs.changed or ingress_reality.changed or gateway_transit.changed or gateway_readers.changed }}'
    network: '{{ container_network }}'
    publish: '{{ mesh_udp_publish + ([''127.0.0.1:'' + (panel_host_port | string) + '':2053/tcp'', ''127.0.0.1:'' + (subscription_host_port
      | string) + '':2096/tcp''] if node_role == ''control'' else (ingress_publish if node_role == ''in'' else [])) }}'
    cap_drop:
    - ALL
    cap_add:
    - NET_ADMIN
    - NET_RAW
    - NET_BIND_SERVICE
    - SETUID
    - SETGID
    - CHOWN
    - DAC_OVERRIDE
    device:
    - /dev/net/tun:/dev/net/tun
    security_opt:
    - label=disable
    - no-new-privileges
    read_only: '{{ node_role != ''control'' }}'
    tmpfs:
      /run: rw,nosuid,nodev
      /tmp: rw,nosuid,nodev
    env: '{{ {''SSL_CERT_FILE'': ''/run/secrets/headscale-ca.pem''} if headscale_ca_file | length > 0 else {} }}'
    volume: '{{ [ (node_dir | realpath) + ''/config.yaml:/etc/node/config.yaml:ro'', (node_dir | realpath) + ''/secrets:/run/secrets:ro'',
      container_name + ''-state:/var/lib/tailscale'', container_name + ''-cache:/var/lib/node''] + ([container_name + ''-db:/etc/x-ui'']
      if node_role == ''control'' else []) }}'
    stop_timeout: 20
    label:
      io.vless.deployment: '{{ deployment_id }}'
    dns: '{{ container_dns_servers }}'
    etc_hosts: '{{ container_extra_hosts }}'
  register: node_container
