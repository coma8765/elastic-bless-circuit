- name: Check optional gateway name ownership
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/container-ownership.yml'
  vars:
    owned_container_name: '{{ deployment_id }}-gateway'
- name: Deploy control with its persistent database
  ansible.builtin.include_role:
    name: node
  vars:
    node_role: control
- name: Wait for the private admin API
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ panel_host_port }}/csrf-token
    status_code: 200
  register: panel_http
  until: panel_http.status == 200
  retries: 45
  delay: 2
- name: Reconcile directory users and public subscription endpoints
  vless_panel:
    url: http://127.0.0.1:{{ panel_host_port }}
    username: '{{ panel_username }}'
    password: '{{ hostvars[groups.headscale[0]].panel_password }}'
    users: '{{ hostvars[groups.headscale[0]].managed_users }}'
    ingress_endpoints: '{{ hostvars[groups.headscale[0]].ingress_endpoints }}'
  register: panel_directory
  no_log: true
- name: Install subscription TLS credentials
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ node_dir }}/secrets/{{ item.dest }}'
    mode: '0600'
  loop:
  - src: '{{ control_tls_cert }}'
    dest: subscription-cert.pem
  - src: '{{ control_tls_key }}'
    dest: subscription-key.pem
  register: gateway_certs
  no_log: true
  when: gateway_enabled | bool
- name: Discover the container network DNS resolver
  ansible.builtin.command:
    argv:
    - '{{ container_engine }}'
    - network
    - inspect
    - '{{ container_network }}'
  register: gateway_network
  changed_when: false
  environment: '{{ container_cli_environment }}'
  when: gateway_enabled | bool and container_engine == 'podman'
- name: Render the subscription-only HTTPS gateway with dynamic upstream DNS
  ansible.builtin.template:
    src: gateway.conf.j2
    dest: '{{ node_dir }}/gateway.conf'
    mode: '0600'
  vars:
    gateway_dns: '{{ ''127.0.0.11'' if container_engine == ''docker'' else (gateway_network.stdout | from_json)[0].subnets[0].gateway
      }}'
  register: gateway_config
  when: gateway_enabled | bool
- name: Start the selected HTTPS gateway runtime
  ansible.builtin.include_tasks: gateway-{{ container_engine }}.yml
  when: gateway_enabled | bool
- name: Remove only the owned Podman gateway when externally terminated
  containers.podman.podman_container:
    name: '{{ deployment_id }}-gateway'
    state: absent
  when: not gateway_enabled | bool and container_engine == 'podman'
- name: Remove only the owned Docker gateway when externally terminated
  community.docker.docker_container:
    name: '{{ deployment_id }}-gateway'
    docker_host: '{{ docker_host }}'
    state: absent
  when: not gateway_enabled | bool and container_engine == 'docker'
