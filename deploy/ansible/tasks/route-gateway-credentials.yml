---
- name: Prepare the gateway's private controller directory
  ansible.builtin.file:
    path: '{{ controller_state_dir }}/route-gateways/{{ gateway_host }}'
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
- name: Save a stable transit credential for each gateway and ingress pair
  ansible.builtin.copy:
    dest: '{{ controller_state_dir }}/route-gateways/{{ gateway_host }}/{{ item }}.uuid'
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) | to_uuid }}"
    force: false
    mode: '0600'
  loop: '{{ hostvars[gateway_host].route_readers }}'
  delegate_to: localhost
  become: false
  no_log: true
